<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PDF</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

<div class="container">
    <h2>JPG to PDF</h2>
    <p>選擇檔案：</p>
    <input type="file" id="file-upload" accept="image/jpeg, image/png" multiple>
    <br><br>
    <button id="convert-btn" py-click="convert_logic">Start and Download</button>
</div>

<py-config>
    packages = ["Pillow"]
</py-config>

<script type="py">
    import io
    from PIL import Image
    from js import document, Uint8Array, window, File, URL
    from pyodide.ffi import create_proxy

    async def convert_logic(event):
        status_div = document.getElementById("status")
        file_input = document.getElementById("file-upload")
        files = file_input.files
        
        if len(files) == 0:
            status_div.innerText = "選擇檔案"
            return

        status_div.innerText = "正在轉換中..."

        image_list = []
        
        # 讀取檔案
        for i in range(len(files)):
            file = files.item(i)
            array_buf = await file.arrayBuffer()
            python_bytes = array_buf.to_bytes()
            img = Image.open(io.BytesIO(python_bytes)).convert('RGB')
            image_list.append(img)

        # 執行轉換
        if image_list:
            pdf_bytes_io = io.BytesIO()
            first_img = image_list.pop(0)
            first_img.save(pdf_bytes_io, format="PDF", save_all=True, append_images=image_list)
            
            pdf_data = pdf_bytes_io.getvalue()
            js_array = Uint8Array.new(pdf_data)
            
            # 建立下載連結
            blob = window.Blob.new([js_array], {type: "application/pdf"})
            url = URL.createObjectURL(blob)
            
            link = document.createElement("a")
            link.href = url
            link.download = "converted_images.pdf"
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
            
            status_div.innerText = "檔案已下載"

</script>

</body>
</html>
